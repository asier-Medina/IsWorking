services:

  db:
    image: postgres:16
    container_name: IsWorking_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - IsWorking_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: IsWorking_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - IsWorking_net

  mongo:
    image: mongo:7
    container_name: IsWorking_mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - IsWorking_net

  # CAMBIO: el servicio "app" pasa a llamarse "backend"
  # porque el proyecto ahora tiene frontend y backend separados.
  backend:
    build:
      context: ./backend    # CAMBIO: antes era "." (raíz). Ahora apunta a la carpeta ./backend
      dockerfile: Dockerfile
    container_name: IsWorking_backend   # CAMBIO: antes era IsWorking_app
    restart: always
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MONGO_URI: mongodb://mongo:27017/isworking
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started  # CAMBIO: añadido para que el backend espere a mongo antes de arrancar
    volumes:
      - ./backend/src:/usr/src/app/src  # CAMBIO: antes era ./src. Ahora apunta a ./backend/src
    networks:
      - IsWorking_net

  # NUEVO: servicio de frontend.
  # Construye la aplicación Next.js que está en la carpeta ./frontend.
  # Disponible en http://localhost:3001 para no colisionar con el backend (3000).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: IsWorking_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "5173:5173"   # antes era 3001:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - IsWorking_net

volumes:
  postgres-data:
  mongo-data:

networks:
  IsWorking_net:
    driver: bridge